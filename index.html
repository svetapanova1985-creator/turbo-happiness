<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер: Додавання та віднімання дробів</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --error-color: #E74C3C;
            --warning-color: #F39C12;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .progress-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .streak-badge {
            background-color: #e8f4fd;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .math-container {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 15px;
        }

        .num {
            border-bottom: 3px solid var(--text-main);
            padding: 0 5px 2px;
            min-width: 25px;
        }

        .den {
            padding: 2px 5px 0;
            min-width: 25px;
        }

        .operator, .equals {
            font-weight: bold;
            margin: 0 10px;
            color: var(--text-muted);
        }

        input {
            width: 60px;
            height: 45px;
            font-size: 1.3rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            margin: 2px 0;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            width: 100%;
            margin-top: 10px;
            font-weight: 600;
        }

        .btn:hover { background-color: #357ABD; }
        .btn:active { transform: scale(0.98); }

        .feedback {
            margin-top: 20px;
            min-height: 50px;
            font-weight: 500;
            line-height: 1.5;
            border-radius: 8px;
            padding: 12px;
            display: none;
            font-size: 0.95rem;
        }

        .feedback.success {
            display: block;
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--success-color);
        }

        .feedback.error {
            display: block;
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
        }
        
        .feedback.warning {
            display: block;
            background-color: rgba(243, 156, 18, 0.1);
            color: var(--warning-color);
        }

        .completion-screen {
            display: none;
        }
        
        .completion-screen h1 {
            color: var(--success-color);
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .completion-screen p {
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .trophy {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pop 0.5s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <div id="game-interface">
        <h2>Мікро-спринт: Дроби</h2>
        <div class="progress-text">
            Серія відповідей: <span id="streak" class="streak-badge">0</span> / 10
        </div>

        <div class="math-container">
            <div class="fraction">
                <div class="num" id="num1">1</div>
                <div class="den" id="den1">2</div>
            </div>
            <div class="operator" id="operator">+</div>
            <div class="fraction">
                <div class="num" id="num2">1</div>
                <div class="den" id="den2">4</div>
            </div>
            <div class="equals">=</div>
            <div class="fraction">
                <input type="number" id="user-num" placeholder="?" autocomplete="off">
                <input type="number" id="user-den" placeholder="?" autocomplete="off">
            </div>
        </div>

        <button class="btn" id="check-btn">Перевірити</button>
        <button class="btn" id="next-btn" style="display: none;">Наступний приклад</button>

        <div id="feedback" class="feedback"></div>
    </div>

    <div id="completion-interface" class="completion-screen">
        <div class="trophy">🏆</div>
        <h1>Картку пройдено!</h1>
        <p>Вітаємо! Ви успішно розв'язали <b>10 прикладів підряд</b> без жодної помилки. Навичка успішно закріплена!</p>
        <button class="btn" id="restart-btn" style="background-color: var(--success-color);">Пройти знову</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        let a, b, c, d, op;
        let streak = 0;

        const num1El = document.getElementById('num1');
        const den1El = document.getElementById('den1');
        const num2El = document.getElementById('num2');
        const den2El = document.getElementById('den2');
        const operatorEl = document.getElementById('operator');
        
        const userNumEl = document.getElementById('user-num');
        const userDenEl = document.getElementById('user-den');
        
        const checkBtn = document.getElementById('check-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackEl = document.getElementById('feedback');
        const streakEl = document.getElementById('streak');
        
        const gameInterface = document.getElementById('game-interface');
        const completionInterface = document.getElementById('completion-interface');

        const gcd = (x, y) => y === 0 ? Math.abs(x) : gcd(y, x % y);
        const lcm = (x, y) => {
            if (x === 0 || y === 0) return 0;
            return Math.abs((x * y) / gcd(x, y));
        };

        function generateProblem() {
            userNumEl.value = '';
            userDenEl.value = '';
            feedbackEl.className = 'feedback';
            feedbackEl.style.display = 'none';
            checkBtn.style.display = 'block';
            nextBtn.style.display = 'none';

            if (streak < 3) {
                // Рівень 1: Легкий старт
                let base = Math.floor(Math.random() * 4) + 2; 
                let mult = Math.floor(Math.random() * 2) + 2; 
                b = base;
                d = base * mult;
                if (Math.random() > 0.5) [b, d] = [d, b];
            } else {
                // Рівень 2: Від 2 до 20, не кратні один одному
                do {
                    b = Math.floor(Math.random() * 19) + 2; // 2..20
                    d = Math.floor(Math.random() * 19) + 2; // 2..20
                } while (b === d || b % d === 0 || d % b === 0);
            }

            op = Math.random() > 0.5 ? '+' : '-';

            let attempts = 0;
            while (attempts < 200) {
                a = Math.floor(Math.random() * (b - 1)) + 1;
                c = Math.floor(Math.random() * (d - 1)) + 1;
                
                // Гарантія нескоротності згенерованих дробів
                if (gcd(a, b) !== 1 || gcd(c, d) !== 1) {
                    attempts++;
                    continue;
                }

                if (op === '+') {
                    if ((a / b) + (c / d) < 1) break;
                } else {
                    if ((a / b) > (c / d)) break;
                }
                attempts++;
            }

            if (attempts >= 200) {
                if (op === '+') {
                    a = 1; c = 1; 
                } else {
                    if (b < d) { a = 1; c = 1; } 
                    else { a = b - 1; c = 1; }
                }
            }

            num1El.innerText = a;
            den1El.innerText = b;
            num2El.innerText = c;
            den2El.innerText = d;
            operatorEl.innerText = op;
            
            userNumEl.focus();
        }

        function checkAnswer() {
            const userNum = parseInt(userNumEl.value);
            const userDen = parseInt(userDenEl.value);

            if (isNaN(userNum) || isNaN(userDen)) {
                showFeedback('Будь ласка, заповніть обидва поля (чисельник і знаменник).', 'warning');
                return;
            }

            const fakeNum = op === '+' ? a + c : a - c;
            const fakeDen = op === '+' ? b + d : Math.abs(b - d);

            if (userNum === fakeNum && userDen === fakeDen) {
                resetStreak();
                showFeedback('Обережно! Знаменники не можна додавати чи віднімати між собою. Спочатку потрібно знайти спільний знаменник!', 'error');
                return;
            }

            const expectedNum = op === '+' ? (a * d + c * b) : (a * d - c * b);
            const expectedDen = b * d;

            const wrongOpNum = op === '+' ? (a * d - c * b) : (a * d + c * b);
            if ((userNum * expectedDen) === (userDen * wrongOpNum)) {
                resetStreak();
                showFeedback(`Уважніше зі знаком! Ти виконав ${op === '+' ? 'віднімання' : 'додавання'}, а потрібно ${op === '+' ? 'додати' : 'відняти'}!`, 'error');
                return;
            }

            const isCorrect = (userNum * expectedDen) === (userDen * expectedNum);

            if (isCorrect) {
                const userFractionGcd = gcd(userNum, userDen);
                if (userFractionGcd !== 1) {
                    showFeedback('Обчислено правильно! Але це ще не кінець. Дріб у відповіді обов\'язково потрібно скоротити.', 'warning');
                    return; 
                }

                streak++;
                streakEl.innerText = streak;
                
                if (streak >= 10) {
                    showCompletion();
                    return;
                }

                showFeedback('Правильно! Розумник(-ця).', 'success');
                checkBtn.style.display = 'none';
                nextBtn.style.display = 'block';
                nextBtn.focus();
            } else {
                resetStreak();
                const isCommonDenominator = (userDen % b === 0) && (userDen % d === 0);
                
                if (isCommonDenominator) {
                    showFeedback(`Спільний знаменник (${userDen}) знайдено правильно! Але помилка в чисельнику. Згадай: коли ми приводимо дріб до нового знаменника, чисельник обов'язково треба помножити на додатковий множник.`, 'error');
                } else {
                    showFeedback(`Помилка у знаменнику. Твій знаменник (${userDen}) не ділиться одночасно на ${b} і ${d} без остачі. Подумай, яке найменше число ділиться на обидва ці знаменники?`, 'error');
                }
            }
        }

        function resetStreak() {
            streak = 0;
            streakEl.innerText = streak;
        }

        function showFeedback(text, type) {
            feedbackEl.innerText = text;
            feedbackEl.className = `feedback ${type}`;
            feedbackEl.style.display = 'block';
        }

        function showCompletion() {
            gameInterface.style.display = 'none';
            completionInterface.style.display = 'block';
        }

        function restartGame() {
            streak = 0;
            streakEl.innerText = streak;
            completionInterface.style.display = 'none';
            gameInterface.style.display = 'block';
            generateProblem();
        }

        checkBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', generateProblem);
        restartBtn.addEventListener('click', restartGame);

        const handleEnterKey = function(event) {
            if (event.key === 'Enter') {
                if (checkBtn.style.display !== 'none') {
                    checkAnswer();
                } else if (nextBtn.style.display !== 'none') {
                    generateProblem();
                }
            }
        };

        userNumEl.addEventListener('keypress', handleEnterKey);
        userDenEl.addEventListener('keypress', handleEnterKey);

        generateProblem();
    });
</script>

</body>
</html>
